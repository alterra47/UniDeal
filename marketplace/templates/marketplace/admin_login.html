{% extends "marketplace/base.html" %}
{% block title %}Admin Login — UniDeal{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh">
    <div class="auth-card animate-in">
        <div class="text-center">
            <h2><i class="bi bi-shield-lock-fill" style="color:var(--ud-danger)"></i> Admin Panel</h2>
            <p class="auth-subtitle">Authorized personnel only</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Admin Username</label>
                <input type="text" class="form-control" name="username" placeholder="Enter admin username" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" placeholder="Enter admin password" required>
            </div>

            <button type="submit" class="btn btn-ud-danger w-100 py-2">
                <i class="bi bi-shield-fill-check"></i> Admin Sign In
            </button>
        </form>

        <p class="text-center mt-3 mb-0" style="font-size:.85rem;color:var(--ud-text-muted)">
            <a href="{% url 'login' %}" style="color:var(--ud-text-muted)">← Back to user login</a>
        </p>
    </div>
</div>
{% endblock %}
