{% extends "marketplace/base.html" %}
{% block title %}Login — UniDeal{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh">
    <div class="auth-card animate-in">
        <div class="text-center">
            <h2><i class="bi bi-box-arrow-in-right" style="color:var(--ud-primary)"></i> Welcome Back</h2>
            <p class="auth-subtitle">Sign in to your UniDeal account</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" name="username" placeholder="Enter your username" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-ud-primary w-100 py-2">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>

        <p class="text-center mt-3 mb-1" style="font-size:.9rem;color:var(--ud-text-muted)">
            Don't have an account? <a href="{% url 'register' %}" style="color:var(--ud-primary-light)">Register</a>
        </p>
        <p class="text-center mb-0" style="font-size:.8rem;color:var(--ud-text-muted)">
            <a href="{% url 'admin_login' %}" style="color:var(--ud-text-muted)">Admin Login →</a>
        </p>
    </div>
</div>
{% endblock %}
